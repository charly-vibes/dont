[pretender]
mode = "tiered"
# Advisory lease for guidance/tiered modes (required since the 0.7.0 pin;
# missing lease fails closed). Renew by pushing the date forward.
advisory_until = "2026-12-31"
languages = ["auto"]
exclude = ["vendor/**", "node_modules/**", "**/*_generated.*", "**/docs/_book/**", "**/target/**", "**/.espectacular/**", "**/.dont/**"]

[roles.test]
paths = ["tests/**", "**/*_test.*", "spec/**"]

[roles.library]
paths = ["pkg/**", "lib/**"]

[roles.script]
paths = ["scripts/**", "examples/**"]

[roles.generated]
paths = ["**/*.pb.go", "**/*_generated.*"]

[roles.vendor]
paths = ["vendor/**", "node_modules/**"]
