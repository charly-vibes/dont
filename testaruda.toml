[adapters]
default = "testaruda-adapter-rust"

[discover]
exclude = [ "target", ".git", "node_modules", ".venv", "venv", "__pycache__", ".mypy_cache", ".pytest_cache", "build", "dist", ".tox",]

[adapters.extensions]
".rs" = "testaruda-adapter-rust"
# No ".py" mapping: this repo ships no pytest suite. scripts/test_pretender_gate.py
# is a standalone harness (run it directly); routing .py here made the pytest
# adapter collect zero tests and exit 5, failing `just test` and `just ci`.
