pre-commit:
  parallel: true
  commands:
    # ddl:managed:start (pre-commit)
    ddl-ah-check:
      run: ah check
    ddl-pretender-gate:
      # only-new gate: fails on new violations vs the committed baseline
      # (.pretender/history/last-findings.json) — gh #29
      run: scripts/pretender-gate
    ddl-spk-lint:
      run: spk lint openspec
    # ddl:managed:end (pre-commit)
# ah:managed:start
    ah-check:
      run: ah check
# ah:managed:end
    lint:
      run: just lint
    fmt:
      run: just fmt-check
    trailing-whitespace:
      run: git diff --check --cached
      exclude: 'Cargo.lock|*.patch'
    end-of-file-fixer:
      run: |
        git diff --cached --name-only -z | xargs -0 -I{} sh -c 'test "$(tail -c1 "{}")" = "" || (echo "{}: missing trailing newline"; exit 1)'
      exclude: 'Cargo.lock|*.png|*.ico|*.jpg|*.gif|*.pdf|*.woff2'
    check-added-large-files:
      run: |
        git diff --cached --name-only -z | xargs -0 -I{} sh -c '
          size=$(wc -c < "{}" 2>/dev/null || echo 0)
          if [ "$size" -gt 5242880 ]; then
            echo "{}: over 5MB"; exit 1
          fi
        '
    dont-prime:
      run: just check-claims

pre-push:
  parallel: true
  commands:
    # ddl:managed:start (pre-push)
    ddl-ah-check:
      run: ah check
    # ddl:managed:end (pre-push)
    lint:
      run: just lint
    fmt:
      run: just fmt-check
    test:
      # Run only affected tests via testaruda --safe (falls back to cargo test)
      run: env -u GIT_DIR -u GIT_INDEX_FILE testaruda select --safe --base origin/main --head HEAD
