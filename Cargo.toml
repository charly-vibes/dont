[package]
name = "dont"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
clap = { version = "4.6.1", features = ["derive"] }
cozo = { version = "0.7.6", default-features = false, features = [
    "rayon",
    "storage-sqlite",
    "storage-sqlite-src",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
ulid = "1.2.1"

[dev-dependencies]
assert_cmd = "2.2.1"
predicates = "3.1.4"
