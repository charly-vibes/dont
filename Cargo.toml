[package]
name = "dont-cli"
version = "0.2.2"
edition = "2024"
description = "Epistemic discipline for autonomous LLM workflows — claims, evidence, and vocabulary tracked as an explicit state machine"
license = "Apache-2.0"
repository = "https://github.com/charly-vibes/dont"
keywords = ["llm", "epistemic", "workflow", "cli"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "dont"

[[bin]]
name = "dont"
path = "src/main.rs"

[[bin]]
name = "dt"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4"
cozo = { version = "0.7.6", default-features = false, features = [
    "rayon",
    "storage-sqlite",
    "storage-sqlite-src",
] }
fs2 = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9"
sha2 = "0.10"
toml = { version = "0.8", default-features = false, features = ["parse"] }
ulid = "1.2.1"

[dev-dependencies]
assert_cmd = "2.2.1"
predicates = "3.1.4"
proptest = "1.9.0"
tempfile = "3.23.0"
