# Pinned ecosystem tool versions for this repo's CI and dev setup.
# Standardization §4: installs are pinned, never `latest` — a broken release
# of any tool must not break CI of the whole fleet.
# Update deliberately; the conformance test (dulce-de-leche
# tests/standard_conformance.rs) requires this file to exist.
#
# §4 matrix row (dont): pretender ✅ · wai ✅ · bd ✅ · openspec ✅ · ddl ✅
# CI already installs wai (git, unpinned) — reconcile to the crates.io pin (DDL-1a0).

[tools]
wai = "2026.9.28"          # crates.io: wai-cli
pretender = "0.6.0"        # crates.io — planned install
dulce-de-leche = "0.7.0"   # crates.io (bin: ddl) — planned install
openspec = "0.19.0"        # npm: @fission-ai/openspec — planned install
# bd = "1.3.0"             # beads — install mechanism TBD (see DDL-1a0)
