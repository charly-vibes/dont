name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # dont-a4lk: cache cargo registry + target so we stop recompiling the
      # world on every run (release.yml already did this; ci.yml did not).
      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # dont-a4lk: prebuilt binaries instead of `cargo install --locked`
      # from source (~8.5min/run). binstall falls back gracefully per-crate;
      # anything without a prebuilt artifact still builds from source below.
      - name: Install cargo-binstall
        uses: taiki-e/install-action@cargo-binstall

      - name: Install quality tools
        run: |
          cargo binstall -y --locked typos-cli || cargo install --locked typos-cli
          cargo binstall -y prek || cargo install --locked prek

      - name: Install Vale
        run: |
          curl -fsSL https://github.com/errata-ai/vale/releases/download/v3.14.1/vale_3.14.1_Linux_64-bit.tar.gz -o vale.tar.gz
          tar -xzf vale.tar.gz
          sudo mv vale /usr/local/bin/vale

      - name: Install wai (§4, pinned)
        run: cargo binstall -y --locked wai-cli@2026.9.28 || cargo install --locked wai-cli@2026.9.28

      - name: Install mdBook
        uses: taiki-e/install-action@mdbook

      # dont-a4lk: nextest for parallel test execution across the 80
      # integration binaries (per-test timing, better failure reporting).
      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest

      - name: Install ecosystem tools (§4 dogfood matrix, pinned)
        run: |
          cargo binstall -y --locked pretender@0.10.0 dulce-de-leche@0.7.0 \
            || cargo install --locked pretender@0.10.0 dulce-de-leche@0.7.0
          npm install -g @fission-ai/openspec@0.19.0
      - name: Install bd (beads, pinned §4)
        run: |
          tmp=$(mktemp -d)
          curl -fsSL https://github.com/gastownhall/beads/releases/download/v1.3.0/beads_1.3.0_linux_amd64.tar.gz -o "$tmp/bd.tgz"
          # extract only the binary — the tarball also ships README/LICENSE/CHANGELOG
          # which must not clobber the repo checkout
          tar -xzf "$tmp/bd.tgz" -C "$tmp" bd
          sudo mv "$tmp/bd" /usr/local/bin/bd
      # §4 dogfood: installed tools must run, not just install
      - name: Smoke dogfooded tools
        env:
          DO_NOT_TRACK: "1"
        run: |
          bd --version >/dev/null
          ddl status >/dev/null
          wai status >/dev/null
          openspec validate --all >/dev/null
          # only-new pretender gate (gh #29): baseline is committed
          scripts/pretender-gate
      # DDL-43g: smoke our own live Pages URL — a 404'd book must fail this
      # repo's CI immediately, not wait for the next hub conformance run.
      - name: Smoke live Pages URL
        run: curl -fsS --max-time 10 --retry 2 https://charly-vibes.github.io/dont/ >/dev/null
      - name: Run repository checks
        run: just ci
